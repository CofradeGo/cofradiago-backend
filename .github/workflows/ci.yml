name: CI Backend

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: cofrade_admin
          POSTGRES_PASSWORD: mipass
          POSTGRES_DB: cofradego_test
        options: >-
          --health-cmd "pg_isready -U cofrade_admin -d cofradego_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://cofrade_admin:mipass@127.0.0.1:5432/cofradego_test?schema=public
      NODE_ENV: test
      JWT_SECRET: test_qa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply pending migrations
        run: npx prisma migrate deploy || echo "No pending migrations"

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test
